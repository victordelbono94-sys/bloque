name: App Bloque

# Compila la app Bloque cada vez que cambia su código nativo y publica el APK
# en la release "app" (descarga directa desde el teléfono).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/puente.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-bloque
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # La llave es siempre la misma para que cada versión se instale encima de la anterior.
      - name: Preparar la llave de firma
        env:
          FIRMA_JKS_B64: ${{ secrets.FIRMA_JKS_B64 }}
        run: |
          if [ -n "$FIRMA_JKS_B64" ]; then
            echo "$FIRMA_JKS_B64" | base64 -d > "$RUNNER_TEMP/bloque.jks"
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/bloque.jks" >> "$GITHUB_ENV"
            echo "FIRMADA=si" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secretos FIRMA_JKS_B64 y FIRMA_CLAVE: se compila para verificar, pero no se publica."
            echo "FIRMADA=no" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        working-directory: android
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_ALIAS: bloque
          VERSION_CODE: ${{ github.run_number }}
        # Los errores se publican también como anotaciones, para poder leerlos sin el log completo.
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Errores de Kotlin y el bloque "What went wrong" completo.
            { grep -E "^e: " "$RUNNER_TEMP/gradle.log" | head -25
              awk '/^\* What went wrong/{f=1; next} /^\* Try:/{f=0} f && NF' "$RUNNER_TEMP/gradle.log" | head -25
            } | sed -E 's/file:\/\/[^ ]*\/android\///' | cut -c1-900 \
              | while IFS= read -r linea; do echo "::error::${linea}"; done
            exit 1
          fi

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk bloque.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bloque
          path: bloque.apk
          retention-days: 7

      - name: Publicar
        if: env.FIRMADA == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Bloque
          make_latest: true
          files: bloque.apk
          body: |
            La app Bloque para Android: entrenamientos, cuerpo y datos de la banda vía Health Connect.

            **Instalar:** abre este enlace desde el teléfono y descarga `bloque.apk`.
            Android va a pedir permiso para instalar apps de esta fuente: acéptalo una vez.

            Versión ${{ github.run_number }} · ${{ github.sha }}
