<!doctype html>
<html lang="es">
<head>

  <script>
    // Chrome avisa muy temprano que la app se puede instalar; se guarda para el botón.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__instalar = e; window.dispatchEvent(new Event('bloque-instalable')); });

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="pantalla-centro">
